plugins {
    id "com.android.application"
}

android {
    namespace "com.plateresco.bibliotecaviva"
    compileSdk 34

    defaultConfig {
        applicationId "com.plateresco.bibliotecaviva"
        minSdk 24
        targetSdk 34
        ndk { abiFilters "arm64-v8a" }     // la voz neuronal trae librerias nativas pesadas; solo para telefonos de 64 bits
        versionCode = Integer.parseInt((project.findProperty("VERSION_CODE") ?: "1").toString())
        versionName = (project.findProperty("VERSION_NAME") ?: "1.0").toString()
        // ID de cliente de Google (tipo Android) para el inicio de sesion nativo. No es un secreto.
        buildConfigField "String", "GOOGLE_CLIENT_ID", "\"${project.findProperty('GOOGLE_CLIENT_ID') ?: ''}\""
    }
    buildFeatures {
        buildConfig true
    }

    // La llave de firma llega por variables de entorno desde GitHub (nunca se guarda en el repositorio).
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "bibliotecaviva"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.android.gms:play-services-auth:21.2.0"
    // Reconocimiento de texto en el telefono (para escanear paginas de libros de papel)
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Voz neuronal sin conexion (sherpa-onnx). El flujo de GitHub baja el .aar a app/libs antes de compilar.
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation "org.apache.commons:commons-compress:1.21"
    // Escaner de codigos de barras de Google (no pide permiso de camara)
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
